<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Azure Apim Emulator">
  <!-- The same ⛩ the landing page carries as an inline data: URI, and the same
       accent (#2a5db0), so the two surfaces read as one site in a tab strip.
       Drawn as paths rather than a <text>⛩</text> glyph: a glyph renders only
       where the font has it, and a favicon is exactly where that degrades
       silently to a blank square. Reasoning from data-agent-service 9c280e5,
       which fixed the same thing. -->
  <rect width="100" height="100" rx="18" fill="#2a5db0"/>
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"><path d="M14 28H86"/><path d="M24 44H76"/><path d="M33 28V84"/><path d="M67 28V84"/></g>
</svg>
