services:
  azure-apim-emulator:
    build: .
    environment:
      APIM_DISABLE_AUTH: "true"
      APIM_DEFAULT_SERVICE: emulator
    ports:
      - "8445:8445"
    volumes:
      - apim-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-apim-emulator", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  apim-data:
