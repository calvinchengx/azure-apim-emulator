# third_party/ is vendored upstream content, and cannot hold this repository's
# secrets by construction: third_party/microsoft/README.md states that nothing
# there is edited, and every file is pinned to a commit of a public Microsoft
# repository. What it does hold is example URLs, because it is documentation --
# `send-one-way-request-policy.md` and `set-method-policy.md` both illustrate a
# <set-url> with a Slack webhook, and push protection reads those as leaked
# credentials.
#
# Excluded rather than redacted. Redacting would mean editing a vendored file,
# which is the one guarantee scripts/derive_*.py rest on: the accepted policy
# surface is DERIVED from these pages rather than transcribed, and a page this
# repository has edited is no longer evidence of what Microsoft documents.
#
# The alternative, allowing each finding by hand, does not hold: re-vendoring is
# a routine operation here -- the point of the derivation scripts is that the
# pages get refreshed rather than copied by hand -- and every refresh would block
# the next push on whatever example URLs the new pages carry.
#
# Scope is deliberately this tree alone. Everything the emulator itself ships
# stays under push protection.
paths-ignore:
  - "third_party/**"
