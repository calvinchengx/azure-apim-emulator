name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - run: make verify

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/check_witnesses.py --strict
      - run: ./scripts/check_policy_inventory.py --strict
      # Binds the parity ledger's operation-surface figures to the committed
      # probe results. The probe itself runs in the `go` job, since it needs a
      # running emulator; this only checks that nothing drifted from it.
      - run: ./scripts/check_operation_inventory.py --strict

  operation-inventory:
    name: Published operation surface (every 2024-05-01 operation probed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Probes all 611 published operations against a fresh service each, and
      # fails if the committed report no longer matches what the emulator
      # serves. Implementing an operation is SUPPOSED to fail this until the
      # report is regenerated: that diff is how the surface changing stays
      # visible instead of being absorbed into a number nobody rechecks.
      - run: APIM_RUN_OPERATION_INVENTORY=1 go test ./e2e/inventory/... -count=1 -timeout 20m
      - run: ./scripts/check_operation_inventory.py --strict

  sdk-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: make setup-sdks
      - run: make test-sdks

  graphql-witness:
    name: GraphQL witness (reference graphql implementation, both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-graphql
      - run: make test-graphql

  grpc-witness:
    name: gRPC witness (grpc-js server and client, real HTTP/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-grpc
      - run: make test-grpc

  soap-witness:
    name: SOAP witness (node soap library, server and client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-soap
      - run: make test-soap

  credential-witness:
    name: Credential manager witness (real OAuth2 authorization server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-credential
      - run: make test-credential

  openai-witness:
    name: LLM token governance witness (OpenAI's own client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-openai
      - run: make test-openai

  mcp-witness:
    name: MCP witness (the reference @modelcontextprotocol client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-mcp
      - run: make test-mcp

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
      - run: docker build -t azure-apim-emulator:test .
      - run: docker compose config --quiet

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds from /docs through website/scripts/sync-docs.mjs, so a broken
      # intra-doc link or unparseable frontmatter fails here rather than on
      # the published site.
      - run: pnpm --filter azure-apim-emulator-docs build
