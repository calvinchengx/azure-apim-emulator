name: CI

# A push to a PR branch used to fire BOTH events, running all 11 jobs twice for
# the same commit: on PR #69 the rollup carried 31 checks of which only 20 were
# distinct, and the 11 duplicates were exactly this file's job count. Filtering
# push to main leaves branch commits covered by the pull_request run and main
# commits covered by the push run, with nothing losing coverage.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs, never superseded main runs. A main commit needs its
# own completed run because that is the record of what main was; a PR branch
# does not, because only its newest commit is being reviewed. Same shape as
# codeql.yml in this repo.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE DOCS LANE. Every job below is gated on `docs_only != 'true'`, except the
  # two that READ the docs. A prose-only change runs those two and nothing else.
  #
  # This replaces the `paths:` filters #129 added. A path filter stops the
  # workflow starting at all, which meant the jobs that check the docs stopped
  # running on the very changes they exist to check: check_witnesses.py reads
  # docs/parity.md, check_docs_links.py reads every page. The lane removes the
  # jobs that cannot see the change, not the ones that check it.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base commit, which a
      # depth-1 checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The self-test runs BESIDE the real classification, every time. A path
      # classifier that stopped matching would answer `false` forever: safe,
      # plausible, and silently useless. The case list is the only thing that
      # would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  go:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/check_witnesses.py --strict
      - run: ./scripts/check_policy_inventory.py --strict
      # Binds the expression inventory to Microsoft's own vendored sources. A
      # refresh of third_party/microsoft that nobody regenerated from fails here
      # rather than leaving the ledger measuring against a stale denominator.
      # The derivations' own reading, tested rather than only re-run: --check
      # compares a record against what the script derives today, and says nothing
      # about whether the script still reads its source correctly.
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: ./scripts/derive_expression_surface.py --check
      - run: ./scripts/derive_limit_attributes.py --check
      - run: ./scripts/derive_policy_sections.py --check
      # Binds the parity ledger's operation-surface figures to the committed
      # probe results. The probe itself runs in the `go` job, since it needs a
      # running emulator; this only checks that nothing drifted from it.
      - run: ./scripts/check_operation_inventory.py --strict

  operation-inventory:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Published operation surface (every 2024-05-01 operation probed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Probes all 611 published operations against a fresh service each, and
      # fails if the committed report no longer matches what the emulator
      # serves. Implementing an operation is SUPPOSED to fail this until the
      # report is regenerated: that diff is how the surface changing stays
      # visible instead of being absorbed into a number nobody rechecks.
      - run: APIM_RUN_OPERATION_INVENTORY=1 go test ./e2e/inventory/... -count=1 -timeout 20m
      - run: ./scripts/check_operation_inventory.py --strict

  sdk-witnesses:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: make setup-sdks
      - run: make test-sdks

  arm-documents-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: ARM documents witness (packaged @azure/arm-apimanagement, every family)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # ITS OWN JOB, like every other witness here. A `ci:` witness resolves to
      # a workflow job, so the job name is the finest thing a parity row can
      # cite; hanging the ARM document families off the broad SDK job would say
      # less about each of them and would let a break in one hide in the other.
      - run: make setup-arm-documents
      - run: make test-arm-documents

  graphql-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: GraphQL witness (reference graphql implementation, both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-graphql
      - run: make test-graphql

  grpc-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: gRPC witness (grpc-js server and client, real HTTP/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-grpc
      - run: make test-grpc

  soap-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: SOAP witness (node soap library, server and client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-soap
      - run: make test-soap

  credential-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Credential manager witness (real OAuth2 authorization server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-credential
      - run: make test-credential

  openid-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: openid-config witness (real OpenID Connect provider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-openid
      - run: make test-openid

  openai-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: LLM token governance witness (OpenAI's own client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-openai
      - run: make test-openai

  mcp-witness:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: MCP witness (the reference @modelcontextprotocol client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-mcp
      - run: make test-mcp

  distribution:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: docker build -t azure-apim-emulator:test .
      - run: docker compose config --quiet

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The build catches unparseable frontmatter, but NOT a dangling intra-doc
      # link: measured, it exits 0 and publishes a 404. This checker is what
      # actually holds the links, and it also fails a page missing from the
      # sidebar, which the build cannot see at all.
      - run: ./scripts/check_docs_links.py --strict
      - run: pnpm install --frozen-lockfile
      # Builds from /docs through website/scripts/sync-docs.mjs, so unparseable
      # frontmatter fails here rather than on the published site.
      - run: pnpm --filter azure-apim-emulator-docs build

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: golangci-lint
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero, alongside the gofmt gate #119 added.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
