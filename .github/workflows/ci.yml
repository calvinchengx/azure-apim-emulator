name: CI

# A push to a PR branch used to fire BOTH events, running all 11 jobs twice for
# the same commit: on PR #69 the rollup carried 31 checks of which only 20 were
# distinct, and the 11 duplicates were exactly this file's job count. Filtering
# push to main leaves branch commits covered by the pull_request run and main
# commits covered by the push run, with nothing losing coverage.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs, never superseded main runs. A main commit needs its
# own completed run because that is the record of what main was; a PR branch
# does not, because only its newest commit is being reviewed. Same shape as
# codeql.yml in this repo.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/check_witnesses.py --strict
      - run: ./scripts/check_policy_inventory.py --strict
      # Binds the expression inventory to Microsoft's own vendored sources. A
      # refresh of third_party/microsoft that nobody regenerated from fails here
      # rather than leaving the ledger measuring against a stale denominator.
      - run: ./scripts/derive_expression_surface.py --check
      - run: ./scripts/derive_limit_attributes.py --check
      # Binds the parity ledger's operation-surface figures to the committed
      # probe results. The probe itself runs in the `go` job, since it needs a
      # running emulator; this only checks that nothing drifted from it.
      - run: ./scripts/check_operation_inventory.py --strict

  operation-inventory:
    name: Published operation surface (every 2024-05-01 operation probed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Probes all 611 published operations against a fresh service each, and
      # fails if the committed report no longer matches what the emulator
      # serves. Implementing an operation is SUPPOSED to fail this until the
      # report is regenerated: that diff is how the surface changing stays
      # visible instead of being absorbed into a number nobody rechecks.
      - run: APIM_RUN_OPERATION_INVENTORY=1 go test ./e2e/inventory/... -count=1 -timeout 20m
      - run: ./scripts/check_operation_inventory.py --strict

  sdk-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: make setup-sdks
      - run: make test-sdks

  arm-documents-witness:
    name: ARM documents witness (packaged @azure/arm-apimanagement, every family)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # ITS OWN JOB, like every other witness here. A `ci:` witness resolves to
      # a workflow job, so the job name is the finest thing a parity row can
      # cite; hanging the ARM document families off the broad SDK job would say
      # less about each of them and would let a break in one hide in the other.
      - run: make setup-arm-documents
      - run: make test-arm-documents

  graphql-witness:
    name: GraphQL witness (reference graphql implementation, both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-graphql
      - run: make test-graphql

  grpc-witness:
    name: gRPC witness (grpc-js server and client, real HTTP/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-grpc
      - run: make test-grpc

  soap-witness:
    name: SOAP witness (node soap library, server and client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-soap
      - run: make test-soap

  credential-witness:
    name: Credential manager witness (real OAuth2 authorization server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-credential
      - run: make test-credential

  openid-witness:
    name: openid-config witness (real OpenID Connect provider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-openid
      - run: make test-openid

  openai-witness:
    name: LLM token governance witness (OpenAI's own client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-openai
      - run: make test-openai

  mcp-witness:
    name: MCP witness (the reference @modelcontextprotocol client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-mcp
      - run: make test-mcp

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: docker build -t azure-apim-emulator:test .
      - run: docker compose config --quiet

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The build catches unparseable frontmatter, but NOT a dangling intra-doc
      # link: measured, it exits 0 and publishes a 404. This checker is what
      # actually holds the links, and it also fails a page missing from the
      # sidebar, which the build cannot see at all.
      - run: ./scripts/check_docs_links.py --strict
      - run: pnpm install --frozen-lockfile
      # Builds from /docs through website/scripts/sync-docs.mjs, so unparseable
      # frontmatter fails here rather than on the published site.
      - run: pnpm --filter azure-apim-emulator-docs build

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero, alongside the gofmt gate #119 added.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
