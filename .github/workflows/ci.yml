name: CI

# A push to a PR branch used to fire BOTH events, running all 11 jobs twice for
# the same commit: on PR #69 the rollup carried 31 checks of which only 20 were
# distinct, and the 11 duplicates were exactly this file's job count. Filtering
# push to main leaves branch commits covered by the pull_request run and main
# commits covered by the push run, with nothing losing coverage.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs, never superseded main runs. A main commit needs its
# own completed run because that is the record of what main was; a PR branch
# does not, because only its newest commit is being reviewed. Same shape as
# codeql.yml in this repo.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - run: make verify

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/check_witnesses.py --strict
      - run: ./scripts/check_policy_inventory.py --strict

  sdk-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: make setup-sdks
      - run: make test-sdks

  graphql-witness:
    name: GraphQL witness (reference graphql implementation, both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-graphql
      - run: make test-graphql

  grpc-witness:
    name: gRPC witness (grpc-js server and client, real HTTP/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-grpc
      - run: make test-grpc

  soap-witness:
    name: SOAP witness (node soap library, server and client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-soap
      - run: make test-soap

  credential-witness:
    name: Credential manager witness (real OAuth2 authorization server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-credential
      - run: make test-credential

  openai-witness:
    name: LLM token governance witness (OpenAI's own client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-openai
      - run: make test-openai

  mcp-witness:
    name: MCP witness (the reference @modelcontextprotocol client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: make setup-mcp
      - run: make test-mcp

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.11
      - run: docker build -t azure-apim-emulator:test .
      - run: docker compose config --quiet

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds from /docs through website/scripts/sync-docs.mjs, so a broken
      # intra-doc link or unparseable frontmatter fails here rather than on
      # the published site.
      - run: pnpm --filter azure-apim-emulator-docs build
