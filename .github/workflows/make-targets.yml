name: Make targets

# The Makefile is the documented entry point, so it gets the same cross-OS
# guarantee the Go tests have — the failures this catches (CRLF shebangs,
# Windows' python3 Store stub, Make falling back to cmd.exe, unquoted
# variables) are platform-specific and invisible on Linux.
#
# Docker coverage is Linux-only by necessity: macOS runners have no daemon,
# Windows runners run only Windows containers. There the container targets
# are checked for correct EXPANSION (make -n), which still catches the
# variable and quoting bug classes.

on:
  workflow_call: # release.yml gates on this
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Same docs lane as ci.yml. Nothing here reads the docs, so every job is
  # gated; see scripts/docs_only_change.py for what counts as documentation.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # THE LANE IS FOR PULL REQUESTS. Every commit on main gets the full
          # matrix, whatever it touched; the reasoning is at the same step in
          # ci.yml.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event is ${GITHUB_EVENT_NAME}, not a pull request: every commit on main gets the full matrix"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  make-targets:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: make targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU Make (Windows only)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Shell scripts parse
        shell: bash
        run: for f in scripts/*.sh; do sh -n "$f"; done

      # EVERY target, not a chosen few. `make -n setup-sdks` is what would
      # have caught a hard-coded .venv/bin/python — a path that does not
      # exist on Windows — in a recipe no Windows job ever expanded.
      - name: Every recipe expands on this OS
        shell: bash
        run: |
          set -euo pipefail
          for t in $(make -rpn 2>/dev/null | awk -F: '/^[a-z][a-z-]*:/ && !/=/ {print $1}' | sort -u); do
            echo "--- make -n $t"
            make -n "$t" >/dev/null
          done

      - name: make build
        shell: bash
        run: make build

      - name: make up / status / down (Linux only — the one OS with Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          make up
          make status
          make down

      - name: Diagnose on failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: docker compose -f compose.yaml logs --no-color --tail 200 || true
