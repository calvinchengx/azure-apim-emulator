name: Make targets

# The Makefile is the documented entry point, so it gets the same cross-OS
# guarantee the Go tests have — the failures this catches (CRLF shebangs,
# Windows' python3 Store stub, Make falling back to cmd.exe, unquoted
# variables) are platform-specific and invisible on Linux.
#
# Docker coverage is Linux-only by necessity: macOS runners have no daemon,
# Windows runners run only Windows containers. There the container targets
# are checked for correct EXPANSION (make -n), which still catches the
# variable and quoting bug classes.

on:
  workflow_call: # release.yml gates on this
  push:
    branches: [main]
    paths:
      # Prose changes do not need the test suite. This is `paths` with
      # negations rather than `paths-ignore`, because paths-ignore cannot
      # re-include anything and docs/generated must be re-included: those
      # files are gates, not docs, and a hand-edited ledger status must still
      # be checked against the code it describes.
      #
      # Patterns apply in order and the LAST match wins, so the re-include of
      # docs/generated sits after every exclusion, or its .md files would be
      # excluded again by the '**/*.md' below it. '*.md' is separate because
      # '**/*.md' needs a directory and does not match the root README.
      - '**'
      - '!docs/**'
      - '!website/**'
      - '!*.md'
      - '!**/*.md'
      - 'docs/generated/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!website/**'
      - '!*.md'
      - '!**/*.md'
      - 'docs/generated/**'

permissions:
  contents: read

jobs:
  make-targets:
    name: make targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU Make (Windows only)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Shell scripts parse
        shell: bash
        run: for f in scripts/*.sh; do sh -n "$f"; done

      # EVERY target, not a chosen few. `make -n setup-sdks` is what would
      # have caught a hard-coded .venv/bin/python — a path that does not
      # exist on Windows — in a recipe no Windows job ever expanded.
      - name: Every recipe expands on this OS
        shell: bash
        run: |
          set -euo pipefail
          for t in $(make -rpn 2>/dev/null | awk -F: '/^[a-z][a-z-]*:/ && !/=/ {print $1}' | sort -u); do
            echo "--- make -n $t"
            make -n "$t" >/dev/null
          done

      - name: make build
        shell: bash
        run: make build

      - name: make up / status / down (Linux only — the one OS with Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          make up
          make status
          make down

      - name: Diagnose on failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: docker compose -f compose.yaml logs --no-color --tail 200 || true
