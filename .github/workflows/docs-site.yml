name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'website/**'
      # The two checkers this workflow now runs. Triggering on the docs they
      # read and not on the scripts that read them would leave an edit to a
      # checker with nothing running it.
      - 'scripts/check_witnesses.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/assemble_site.py'
      - 'scripts/build_landing_data.py'
      - 'Makefile'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check: the docs generator shells out to
  # git for the parity versions, so a PR that breaks it should fail here rather
  # than after merge. Build only: the deploy job is skipped below.
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'website/**'
      # The two checkers this workflow now runs. Triggering on the docs they
      # read and not on the scripts that read them would leave an edit to a
      # checker with nothing running it.
      - 'scripts/check_witnesses.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/assemble_site.py'
      - 'scripts/build_landing_data.py'
      - 'Makefile'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Read-only floor. The deploy job escalates in its own block to publish to
# GitHub Pages.
permissions:
  contents: read

# One in-flight deploy at a time; don't cancel a running publish.
#
# PR builds get their OWN group, per ref. They must not share the deploy group:
# GitHub keeps at most one PENDING run per concurrency group and cancels the
# older one when a newer arrives, so while runners are saturated a steady
# arrival of PR builds cancels the queued main-branch run over and over and the
# site never publishes. This repo demonstrated it: a Dependabot batch cancelled
# the deploys for two consecutive main pushes, with no error anywhere to say so
# — a cancelled run reads exactly like a harmless supersession.
#
# PR builds also cancel their own predecessors (only the newest matters);
# deploys never cancel a running publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      # Shallow is fine: unlike the other family sites, this one generates no
      # per-release parity snapshots yet, so nothing reads the tag history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned to a PATCH, not a major: Astro checks its own engine range
          # at startup, and 7.4.2 requires >=22.23.4 while `node-version: '22'`
          # resolves to whatever 22.x the runner happens to carry -- which was
          # 22.23.3, one patch short, and every build died with "Node.js
          # v22.23.3 is not supported by Astro!".
          node-version: '22.23.4'
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
      # ONE STEP, AND IT IS THE ONE A DEVELOPER RUNS. `make docs-serve` builds
      # with this same target and then serves the result at the paths it
      # publishes under, so what is previewed locally is what deploys from
      # here. Spelling the sequence out in YAML instead is how the two drift:
      # the local recipe is the one nobody updates, and it is also the only one
      # anyone looks at before pushing. `make docs` was that drift -- it ran
      # the Starlight build alone and left a tree Pages never serves.
      #
      # THE TWO CHECKS THAT READ DOCS RUN IN BOTH WORKFLOWS ON PURPOSE, and
      # they are inside the target now.
      #
      # ci.yml owns them and ci.yml no longer triggers on a prose change: its
      # `paths` excludes `!docs/**` and `!**/*.md` and re-includes only
      # `docs/generated/**`. So as of that filter, editing `docs/parity.md`
      # skipped `check_witnesses.py --strict` -- the check whose whole job is to
      # refuse a green claim with no witness behind it -- and editing any page
      # skipped `check_docs_links.py --strict`. The edit that could break a
      # parity claim was exactly the edit that skipped the check on it.
      #
      # Re-including the two files in ci.yml would fix the witness half and not
      # the links half, which reads EVERY page: expressing "any docs edit" as a
      # re-include means re-including all docs, and the filter is then pointless.
      # So the two trigger sets are complementary instead: a prose change runs
      # them here, a code change runs them in ci.yml, and neither kind of change
      # reaches main without the check that reads it having run.
      - run: make docs-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy to GitHub Pages
    needs: build
    # PRs get the build as a check only. Deploying from a PR ref would be
    # rejected by the github-pages environment regardless.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
